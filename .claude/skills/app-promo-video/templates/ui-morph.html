<!-- One UI element that becomes the next one: button → loader → check → slider → toggle → tabs.
     Rename fNN to the frame prefix (f06), paste the CSS into the frame's <style>, the markup inside #root, and the
     script inside the frame's IIFE after `tl`. Keep only the states the frame needs: delete their entries in T, the
     moves that use them and their lines in render(). Labels are placeholders: put the app's own words from the kit.

     Every value is a closed-form function of time (no physics loop, no state carried between frames), so a seek to
     any frame draws the same picture in preview, snapshot and render. One paused GSAP tween drives the clock. -->

<style>
  /* no will-change anywhere here: under a CSS 3D camera a will-change layer is rastered once at its own size and
     turns soft when the camera zooms in */
  #fNN-um { position: absolute; left: 0; top: 0; width: 1920px; height: 888px; pointer-events: none; }
  .fNN-um-box { position: absolute; overflow: hidden; border-radius: 48px; background: #4f46e5; transform-origin: 50% 50%; }
  .fNN-um-label { position: absolute; left: 0; right: 0; top: 50%; text-align: center; white-space: nowrap;
    font: 600 34px/1 var(--font-body, "Inter"), sans-serif; color: #fff; }
  .fNN-um-icon { position: absolute; left: 50%; top: 50%; }
  .fNN-um-fill { position: absolute; left: 0; top: 0; bottom: 0; background: #a5b4fc; }
  .fNN-um-knob { position: absolute; border-radius: 50%; background: #fff; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28); }
  .fNN-um-ind { position: absolute; top: 8px; bottom: 8px; border-radius: 40px; background: rgba(255, 255, 255, 0.2); }
  .fNN-um-tab { position: absolute; top: 0; bottom: 0; width: 220px; display: flex; align-items: center; justify-content: center;
    font: 600 28px/1 var(--font-body, "Inter"), sans-serif; color: #fff; }
  /* the touch: a finger-sized dot, not an arrow pointer (phones have no pointer) */
  .fNN-um-cursor { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.82); border: 3px solid rgba(17, 24, 39, 0.45); }
</style>

<div id="fNN-um">
  <div class="fNN-um-box">
    <div class="fNN-um-label">Tải xuống</div>
    <svg class="fNN-um-icon fNN-um-spin" width="44" height="44" viewBox="0 0 44 44" style="margin:-22px 0 0 -22px">
      <circle cx="22" cy="22" r="18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="80 200" />
    </svg>
    <svg class="fNN-um-icon fNN-um-check" width="52" height="52" viewBox="0 0 52 52" style="margin:-26px 0 0 -26px">
      <path d="M12 27 L22 37 L41 16" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <div class="fNN-um-fill"></div>
    <div class="fNN-um-knob fNN-um-tknob" style="top:8px;width:80px;height:80px"></div>
    <div class="fNN-um-ind"></div>
    <div class="fNN-um-tab" style="left:0">Đọc</div>
    <div class="fNN-um-tab" style="left:220px">Nghe</div>
    <div class="fNN-um-tab" style="left:440px">Ôn tập</div>
  </div>
  <!-- the slider knob is taller than its track, so it lives outside the clipping box -->
  <div class="fNN-um-knob fNN-um-sknob" style="width:56px;height:56px;margin:-28px 0 0 -28px"></div>
  <div class="fNN-um-cursor"></div>
</div>

<script>
  // inside the frame's IIFE, after: const tl = gsap.timeline({ paused: true });
  const umRoot = document.querySelector("#fNN-um");
  const um = (c) => umRoot.querySelector(".fNN-um-" + c);
  const box = um("box"), label = um("label"), spin = um("spin"), check = um("check"), fill = um("fill");
  const sKnob = um("sknob"), tKnob = um("tknob"), ind = um("ind"), cursor = um("cursor");
  const tabs = umRoot.querySelectorAll(".fNN-um-tab");

  // ---- maths: pure functions of time ----
  // Step response of a damped spring from 0 to 1, starting at rest. k stiffness, c damping (mass 1).
  // ζ = c / (2√k): under 1 overshoots, 1 settles fastest without overshoot, over 1 creeps.
  const SPRING = {
    snappy: { k: 380, c: 34 }, // ζ ≈ 0.87, a hint of overshoot, settled in about 0.35 s
    smooth: { k: 170, c: 26 }, // ζ ≈ 1.0, no overshoot, about 0.5 s
    bouncy: { k: 260, c: 16 }, // ζ ≈ 0.5, one visible overshoot: a released knob, a toggle
    lazy: { k: 90, c: 19 }, //    ζ ≈ 1.0, about 0.8 s: the trailing edge of a stretching indicator
  };
  function spring(t, s) {
    if (t <= 0) return 0;
    const w0 = Math.sqrt(s.k), z = s.c / (2 * w0);
    if (z < 0.999) {
      const wd = w0 * Math.sqrt(1 - z * z);
      return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + ((z * w0) / wd) * Math.sin(wd * t));
    }
    if (z <= 1.001) return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
    const q = Math.sqrt(z * z - 1), r1 = -w0 * (z - q), r2 = -w0 * (z + q);
    return 1 + (r2 * Math.exp(r1 * t) - r1 * Math.exp(r2 * t)) / (r1 - r2);
  }
  // A value with many targets is a sum of springs: each retarget adds one spring for the change, so a new target
  // arriving mid-flight keeps the speed the value already has instead of restarting from rest.
  // moves: [[time, target, SPRING.x], …] in time order.
  function track(v0, moves) {
    return (t) => moves.reduce((v, [at, to, s], i) => v + (to - (i ? moves[i - 1][1] : v0)) * spring(t - at, s), v0);
  }
  const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  function colorTrack(c0, moves) {
    const ch = [0, 1, 2].map((i) => track(rgb(c0)[i], moves.map(([at, c, s]) => [at, rgb(c)[i], s])));
    return (t) => "rgb(" + ch.map((f) => Math.round(Math.min(255, Math.max(0, f(t))))).join(",") + ")";
  }
  const clamp01 = (x) => Math.min(1, Math.max(0, x));
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const inOut = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  // Swapped text has its own timing: the old word leaves fast and up (0.12 s), the new one arrives from below over
  // 0.24 s. Visible from `a` until `b`.
  function shown(t, a, b) {
    if (b !== undefined && t >= b) { const p = clamp01((t - b) / 0.12); return { o: 1 - p, y: -10 * p }; }
    const p = outCubic(clamp01((t - a) / 0.24));
    return { o: p, y: 14 * (1 - p) };
  }
  // fade in over 0.15 s from a, out over 0.12 s from b
  const win = (t, a, b) => clamp01((t - a) / 0.15) * (1 - clamp01((t - b) / 0.12));
  // a point moving through keys [[t, x, y], …], eased between keys, holding outside them
  function path(keys) {
    return (t) => {
      if (t <= keys[0][0]) return [keys[0][1], keys[0][2]];
      for (let i = 1; i < keys.length; i++) {
        const [t1, x1, y1] = keys[i];
        if (t <= t1) {
          const [t0, x0, y0] = keys[i - 1], p = inOut((t - t0) / (t1 - t0 || 1));
          return [x0 + (x1 - x0) * p, y0 + (y1 - y0) * p];
        }
      }
      const k = keys[keys.length - 1];
      return [k[1], k[2]];
    };
  }

  // ---- the beats: seconds from the start of this tween (move them onto the words of the voice-over) ----
  const T0 = 0; // where the morph starts in the frame
  const T = { tap: 0.8, load: 1.0, done: 2.4, slider: 3.4, grab: 4.5, release: 5.4, toggle: 6.3, flip: 7.0, tabs: 8.0, tab2: 9.0, tab1: 10.0 };
  const DUR = 11;
  const CX = 960, CY = 444; // centre of the element on the 1920 × 888 stage
  const SW = 560; // slider width
  const W = track(360, [[T.load, 96, SPRING.snappy], [T.slider, SW, SPRING.smooth], [T.toggle, 176, SPRING.smooth], [T.tabs, 660, SPRING.smooth]]);
  const H = track(96, [[T.slider, 24, SPRING.smooth], [T.toggle, 96, SPRING.smooth], [T.tabs, 88, SPRING.smooth]]);
  const BG = colorTrack("#4f46e5", [[T.done, "#16a34a", SPRING.smooth], [T.slider, "#312e81", SPRING.smooth], [T.toggle, "#4b5563", SPRING.smooth], [T.flip, "#4f46e5", SPRING.snappy], [T.tabs, "#1f2937", SPRING.smooth]]);
  // a press: down and back up, made of two springs (the second cancels the first 0.1 s later)
  const press = (t, at) => 0.05 * (spring(t - at, SPRING.snappy) - spring(t - at - 0.1, SPRING.snappy));
  // slider: the knob follows the finger exactly while held (direct manipulation), then springs to its detent
  const sLeft = CX - SW / 2, grabX = sLeft + 0.2 * SW, dropX = sLeft + 0.85 * SW, restX = sLeft + 0.6 * SW;
  // the finger's whole route; it rests off the element between gestures
  const away = [CX + 300, CY + 230];
  const finger = path([
    [0.2, ...away], [0.75, CX + 60, CY + 10], [1.05, CX + 60, CY + 10], [1.6, ...away],
    [T.slider + 0.5, ...away], [T.grab - 0.05, grabX, CY], [T.release - 0.05, dropX, CY], [T.release + 0.6, ...away],
    [T.flip - 0.5, ...away], [T.flip - 0.05, CX - 40, CY], [T.flip + 0.3, CX + 40, CY], [T.flip + 0.8, ...away],
    [T.tab2 - 0.5, ...away], [T.tab2 - 0.05, CX + 220, CY], [T.tab1 - 0.45, CX + 220, CY], [T.tab1 - 0.05, CX, CY], [T.tab1 + 0.6, ...away],
  ]);
  const fingerOn = (t) => Math.max(win(t, 0.2, 1.5), win(t, T.slider + 0.5, T.release + 0.5), win(t, T.flip - 0.5, T.flip + 0.7), win(t, T.tab2 - 0.5, T.tab1 + 0.5));
  const knobX = (t) => {
    if (t < T.grab) return grabX;
    if (t < T.release) return finger(t)[0];
    return dropX + (restX - dropX) * spring(t - T.release, SPRING.bouncy);
  };
  // tabs: the edge in front moves on a stiff spring, the edge behind on a lazy one, so the indicator stretches toward
  // the new tab and then catches up. Going right the right edge leads; going left the left edge leads.
  const indL = track(8, [[T.tab2, 448, SPRING.lazy], [T.tab1, 228, SPRING.snappy]]);
  const indR = track(212, [[T.tab2, 652, SPRING.snappy], [T.tab1, 432, SPRING.lazy]]);

  function render(t) {
    const w = W(t), h = H(t);
    const s = 1 - press(t, T.tap) - press(t, T.flip) - press(t, T.tab2) - press(t, T.tab1);
    Object.assign(box.style, {
      width: w + "px", height: h + "px", left: CX - w / 2 + "px", top: CY - h / 2 + "px",
      borderRadius: h / 2 + "px", background: BG(t), transform: "scale(" + s + ")",
    });
    const lb = shown(t, -1, T.load);
    label.style.opacity = lb.o;
    label.style.transform = "translateY(calc(-50% + " + lb.y + "px))";
    spin.style.opacity = win(t, T.load + 0.12, T.done);
    spin.style.transform = "rotate(" + Math.max(0, t - T.load) * 420 + "deg)";
    check.style.opacity = win(t, T.done, T.slider);
    check.querySelector("path").style.strokeDasharray = "48";
    check.querySelector("path").style.strokeDashoffset = 48 * (1 - clamp01(spring(t - T.done - 0.08, SPRING.snappy)));
    const sOn = win(t, T.slider + 0.25, T.toggle);
    const kx = knobX(t);
    fill.style.opacity = sOn;
    fill.style.width = Math.max(0, kx - (CX - w / 2)) + "px";
    Object.assign(sKnob.style, { opacity: sOn, left: kx + "px", top: CY + "px" });
    tKnob.style.opacity = win(t, T.toggle + 0.2, T.tabs);
    tKnob.style.left = 8 + 80 * spring(t - T.flip, SPRING.bouncy) + "px";
    ind.style.opacity = win(t, T.tabs + 0.3, DUR + 1);
    ind.style.left = indL(t) + "px";
    ind.style.width = Math.max(40, indR(t) - indL(t)) + "px";
    tabs.forEach((el, i) => {
      const v = shown(t, T.tabs + 0.25 + i * 0.06);
      el.style.opacity = v.o;
      el.style.transform = "translateY(" + v.y + "px)";
    });
    const [fx, fy] = finger(t);
    const held = t >= T.grab && t < T.release ? 0.86 : 1;
    Object.assign(cursor.style, { opacity: fingerOn(t), left: fx + "px", top: fy + "px", transform: "scale(" + held * (1 - 3 * press(t, T.tap) - 3 * press(t, T.flip) - 3 * press(t, T.tab2) - 3 * press(t, T.tab1)) + ")" });
  }

  // one linear clock tween; every seek calls render with the exact local time
  const umClock = { t: 0 };
  tl.to(umClock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(umClock.t) }, T0);
  render(0);
</script>
