<!--
  timeline-scan: three points in time light up one after another along a line.
  Scene template of the vi-explainer-video skill. Adapted from templates/timeline-scan of
  nutllwhy/hyperframes-motion-library (MIT License, Copyright (c) 2026 栗噔噔 (nutllwhy));
  the full notice is in LICENSE-hyperframes-motion-library.txt. Changed here: frame format
  of faceless-explainer, Vietnamese fonts and copy, content kept above the caption zone,
  cue times taken from the narration, no exit animation.

  To use it for frame NN (see README.md in this folder):
    1. copy to compositions/frames/NN-slug.html; replace every "fNN-" with the frame prefix
       (f03-) and every "NN-slug" with the frame id;
    2. replace the tokens and the @font-face lines with those of the project's frame.md;
    3. replace the copy: title, three time marks (at most 5 characters), three names and three one-line descriptions;
    4. set T to the word starts of this frame (title, point 1, point 2, point 3) and END to its duration.
-->
<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-VN.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-VN.woff2") format("woff2"); font-weight: 100 800; font-style: normal; font-display: block; }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    /* tokens: ground, text, secondary text (>= 4.5:1 on the ground), accent, text on the accent, rules */
    .fNN-bg, .fNN-scene {
      --st-ground: #12100E;
      --st-ink: #F4EFE7;
      --st-muted: #B8ADA2;
      --st-accent: #FF5A36;
      --st-on-accent: #12100E;
      --st-line: rgba(244, 239, 231, 0.26);
      --st-display: "Inter", sans-serif;
      --st-mono: "JetBrains Mono", monospace;
    }
    .fNN-bg { position: absolute; inset: 0; background: var(--st-ground); }
    /* content box: ends at y = 862, above the caption zone (y > 896) */
    .fNN-scene {
      position: absolute;
      left: 108px;
      top: 72px;
      width: 1704px;
      height: 790px;
      box-sizing: border-box;
      font-family: var(--st-display);
      color: var(--st-ink);
    }
    .fNN-scene * { box-sizing: border-box; }
    .fNN-topbar { position: absolute; left: 0; top: 0; width: 1704px; height: 8px; background: var(--st-line); }
    .fNN-topbar-fill { width: 38%; height: 100%; background: var(--st-accent); transform-origin: left center; }

    .fNN-title { position: absolute; left: 0; top: 56px; width: 1704px; margin: 0; font-size: 76px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; opacity: 0; }
    .fNN-line { position: absolute; left: 284px; top: 363px; width: 1136px; height: 5px; background: var(--st-line); }
    .fNN-line-fill { width: 100%; height: 100%; background: var(--st-accent); transform-origin: left center; transform: scaleX(0); }
    .fNN-nodes { position: absolute; left: 0; top: 300px; width: 1704px; display: grid; grid-template-columns: repeat(3, 1fr); }
    .fNN-node { display: grid; justify-items: center; text-align: center; padding: 0 28px; opacity: 0; }
    .fNN-dot { width: 132px; height: 132px; display: grid; place-items: center; border-radius: 50%; background: var(--st-accent); color: var(--st-on-accent); font-family: var(--st-mono); font-size: 34px; font-weight: 800; line-height: 1; }
    .fNN-name { margin-top: 40px; font-size: 54px; font-weight: 800; line-height: 1.18; letter-spacing: -0.02em; }
    .fNN-desc { margin-top: 18px; color: var(--st-muted); font-size: 33px; font-weight: 600; line-height: 1.42; }
  </style>

  <div id="root" data-composition-id="NN-slug" data-width="1920" data-height="1080" data-duration="7">
    <div id="fNN-bg" class="clip fNN-bg" data-start="0" data-duration="7" data-track-index="0"></div>
    <div class="fNN-scene">
      <div class="fNN-topbar" data-layout-ignore><div class="fNN-topbar-fill"></div></div>
      <h1 class="fNN-title">Ba chặng của một dự án</h1>
      <div class="fNN-line" data-layout-ignore><div class="fNN-line-fill"></div></div>
      <div class="fNN-nodes">
        <div class="fNN-node" id="fNN-node-1"><div class="fNN-dot">2023</div><div class="fNN-name">Thử nghiệm</div><div class="fNN-desc">Một nhóm nhỏ, một bài toán</div></div>
        <div class="fNN-node" id="fNN-node-2"><div class="fNN-dot">2024</div><div class="fNN-name">Mở rộng</div><div class="fNN-desc">Thêm đội, thêm quy trình chung</div></div>
        <div class="fNN-node" id="fNN-node-3"><div class="fNN-dot">2025</div><div class="fNN-name">Vận hành</div><div class="fNN-desc">Đo lường và cải tiến đều đặn</div></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      // seconds from the start of the frame: the word starts of the title and of each point
      var T = { title: 0.3, nodes: [1.4, 3.0, 4.6] };
      var END = 7;

      tl.fromTo(".fNN-topbar-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".fNN-title", { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.42, ease: "circ.out" }, T.title);
      T.nodes.forEach(function (t, i) {
        var node = "#fNN-node-" + (i + 1);
        if (i > 0) tl.fromTo(".fNN-line-fill", { scaleX: (i - 1) / 2 }, { scaleX: i / 2, duration: 0.6, ease: "power3.inOut", immediateRender: false }, t - 0.45);
        tl.fromTo(node, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, t);
        tl.fromTo(node + " .fNN-dot", { scale: 0 }, { scale: 1, duration: 0.42, ease: "back.out(2)" }, t);
      });

      // hold still to the end of the frame
      tl.set({}, {}, END);
      window.__timelines["NN-slug"] = tl;
    })();
  </script>
</template>
