<!--
  bar-compare: a title and three columns that grow one at a time, each carrying its number up with it.
  Scene template of the vi-explainer-video skill, written for this skill in the frame format
  of faceless-explainer: Vietnamese fonts, content kept above the caption zone, cue times
  taken from the narration, no exit animation.

  To use it for frame NN (see README.md in this folder):
    1. copy to compositions/frames/NN-slug.html; replace every "fNN-" with the frame prefix
       (f03-) and every "NN-slug" with the frame id;
    2. replace the tokens and the @font-face lines with those of the project's frame.md;
    3. replace the copy: title, three whole-number values with their unit, three names (<= 16
       characters) and three one-line descriptions; set H to each bar's share of the tallest;
    4. set T to the word starts of this frame (title, value 1, 2, 3) and END to its duration.
-->
<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-VN.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-VN.woff2") format("woff2"); font-weight: 100 800; font-style: normal; font-display: block; }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    /* tokens: ground, text, secondary text (>= 4.5:1 on the ground), accent, text on the accent, rules */
    .fNN-bg, .fNN-scene {
      --st-ground: #12100E;
      --st-ink: #F4EFE7;
      --st-muted: #B8ADA2;
      --st-accent: #FF5A36;
      --st-on-accent: #12100E;
      --st-line: rgba(244, 239, 231, 0.26);
      --st-display: "Inter", sans-serif;
      --st-mono: "JetBrains Mono", monospace;
    }
    .fNN-bg { position: absolute; inset: 0; background: var(--st-ground); }
    /* content box: ends at y = 862, above the caption zone (y > 896) */
    .fNN-scene {
      position: absolute;
      left: 108px;
      top: 72px;
      width: 1704px;
      height: 790px;
      box-sizing: border-box;
      font-family: var(--st-display);
      color: var(--st-ink);
    }
    .fNN-scene * { box-sizing: border-box; }
    .fNN-topbar { position: absolute; left: 0; top: 0; width: 1704px; height: 8px; background: var(--st-line); }
    .fNN-topbar-fill { width: 38%; height: 100%; background: var(--st-accent); transform-origin: left center; }
    .fNN-title { position: absolute; left: 0; top: 56px; width: 1704px; margin: 0; font-size: 76px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; opacity: 0; }
    .fNN-base { position: absolute; left: 0; top: 660px; width: 1704px; height: 4px; background: var(--st-line); }
    .fNN-cols { position: absolute; left: 0; top: 250px; width: 1704px; height: 540px; display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 36px; }
    .fNN-col { position: relative; }
    /* the bar is 320 px at 100%; its top rides on scaleY and the value rides with it */
    .fNN-bar { position: absolute; left: 0; top: 90px; width: 300px; height: 320px; background: var(--st-line); transform-origin: left bottom; transform: scaleY(0); }
    .fNN-col:last-child .fNN-bar { background: var(--st-accent); }
    .fNN-value { position: absolute; left: 0; top: 314px; width: 520px; margin: 0; font-size: 84px; font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; opacity: 0; }
    .fNN-unit { margin-left: 10px; font-family: var(--st-mono); font-size: 34px; font-weight: 700; letter-spacing: 0; color: var(--st-muted); }
    .fNN-name { position: absolute; left: 0; top: 436px; width: 520px; margin: 0; font-size: 40px; font-weight: 700; line-height: 1.25; opacity: 0; }
    .fNN-desc { display: block; margin-top: 8px; color: var(--st-muted); font-size: 30px; font-weight: 600; line-height: 1.35; }
  </style>

  <div id="root" data-composition-id="NN-slug" data-width="1920" data-height="1080" data-duration="7">
    <div id="fNN-bg" class="clip fNN-bg" data-start="0" data-duration="7" data-track-index="0"></div>
    <div class="fNN-scene">
      <div class="fNN-topbar" data-layout-ignore><div class="fNN-topbar-fill"></div></div>
      <h1 class="fNN-title">Mỗi lần đo, con số lại lớn hơn</h1>
      <div class="fNN-base" data-layout-ignore></div>
      <div class="fNN-cols">
        <article class="fNN-col" id="fNN-col-1"><div class="fNN-bar" data-layout-ignore></div><p class="fNN-value"><span class="fNN-num">12</span><span class="fNN-unit">%</span></p><p class="fNN-name">Năm đầu<span class="fNN-desc">Mới bắt đầu thử</span></p></article>
        <article class="fNN-col" id="fNN-col-2"><div class="fNN-bar" data-layout-ignore></div><p class="fNN-value"><span class="fNN-num">38</span><span class="fNN-unit">%</span></p><p class="fNN-name">Năm thứ hai<span class="fNN-desc">Đã thành thói quen</span></p></article>
        <article class="fNN-col" id="fNN-col-3"><div class="fNN-bar" data-layout-ignore></div><p class="fNN-value"><span class="fNN-num">74</span><span class="fNN-unit">%</span></p><p class="fNN-name">Năm nay<span class="fNN-desc">Phần lớn đã dùng</span></p></article>
      </div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      // seconds from the start of the frame: the word starts of the title and of each value
      var T = { title: 0.3, bars: [1.4, 3.0, 4.6] };
      // bar heights as a share of the tallest bar (0..1), in the order of the columns
      var H = [0.16, 0.51, 1];
      var END = 7;

      tl.fromTo(".fNN-topbar-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".fNN-title", { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.45, ease: "circ.out" }, T.title);
      T.bars.forEach(function (t, i) {
        var col = "#fNN-col-" + (i + 1);
        var num = document.querySelector(col + " .fNN-num");
        var to = Number(num.textContent);
        var count = { v: 0 };
        tl.fromTo(col + " .fNN-bar", { scaleY: 0 }, { scaleY: H[i], duration: 0.9, ease: "power3.out" }, t);
        tl.fromTo(col + " .fNN-value", { opacity: 0, y: 0 }, { opacity: 1, y: -320 * H[i], duration: 0.9, ease: "power3.out" }, t);
        // the number is a function of timeline time only, so any frame renders the same
        tl.to(count, { v: to, duration: 0.9, ease: "power3.out", onUpdate: function () { num.textContent = Math.round(count.v); } }, t);
        tl.fromTo(col + " .fNN-name", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t + 0.15);
      });

      // hold still to the end of the frame
      tl.set({}, {}, END);
      window.__timelines["NN-slug"] = tl;
    })();
  </script>
</template>
