<!--
  checklist-tick: a title and four items laid out at once, then ticked off one by one as the narration reaches them.
  Scene template of the vi-explainer-video skill, written for this skill in the frame format
  of faceless-explainer: Vietnamese fonts, content kept above the caption zone, cue times
  taken from the narration, no exit animation.

  To use it for frame NN (see README.md in this folder):
    1. copy to compositions/frames/NN-slug.html; replace every "fNN-" with the frame prefix
       (f03-) and every "NN-slug" with the frame id;
    2. replace the tokens and the @font-face lines with those of the project's frame.md;
    3. replace the copy: title, four items (<= 28 characters) and the short status shown at
       the right of each once it is ticked (<= 12 characters);
    4. set T to the word starts of this frame (title, list, tick 1..4) and END to its duration.
-->
<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-VN.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-VN.woff2") format("woff2"); font-weight: 100 800; font-style: normal; font-display: block; }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    /* tokens: ground, text, secondary text (>= 4.5:1 on the ground), accent, text on the accent, rules */
    .fNN-bg, .fNN-scene {
      --st-ground: #12100E;
      --st-ink: #F4EFE7;
      --st-muted: #B8ADA2;
      --st-accent: #FF5A36;
      --st-on-accent: #12100E;
      --st-line: rgba(244, 239, 231, 0.26);
      --st-display: "Inter", sans-serif;
      --st-mono: "JetBrains Mono", monospace;
    }
    .fNN-bg { position: absolute; inset: 0; background: var(--st-ground); }
    /* content box: ends at y = 862, above the caption zone (y > 896) */
    .fNN-scene {
      position: absolute;
      left: 108px;
      top: 72px;
      width: 1704px;
      height: 790px;
      box-sizing: border-box;
      font-family: var(--st-display);
      color: var(--st-ink);
    }
    .fNN-scene * { box-sizing: border-box; }
    .fNN-topbar { position: absolute; left: 0; top: 0; width: 1704px; height: 8px; background: var(--st-line); }
    .fNN-topbar-fill { width: 38%; height: 100%; background: var(--st-accent); transform-origin: left center; }
    .fNN-title { position: absolute; left: 0; top: 56px; width: 1704px; margin: 0; font-size: 76px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; opacity: 0; }
    .fNN-list { position: absolute; left: 0; top: 240px; width: 1704px; margin: 0; padding: 0; list-style: none; }
    .fNN-item { position: relative; height: 128px; padding: 22px 0 0 124px; border-bottom: 4px solid var(--st-line); opacity: 0; }
    .fNN-box { position: absolute; left: 0; top: 24px; width: 76px; height: 76px; border: 4px solid var(--st-line); }
    .fNN-fill { position: absolute; inset: 0; display: grid; place-items: center; background: var(--st-accent); color: var(--st-on-accent); font-size: 52px; font-weight: 800; line-height: 1; transform: scale(0); }
    .fNN-text { margin: 0; font-size: 52px; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
    .fNN-desc { position: absolute; right: 0; top: 40px; margin: 0; color: var(--st-muted); font-family: var(--st-mono); font-size: 30px; font-weight: 700; line-height: 1.3; opacity: 0; }
  </style>

  <div id="root" data-composition-id="NN-slug" data-width="1920" data-height="1080" data-duration="9">
    <div id="fNN-bg" class="clip fNN-bg" data-start="0" data-duration="9" data-track-index="0"></div>
    <div class="fNN-scene">
      <div class="fNN-topbar" data-layout-ignore><div class="fNN-topbar-fill"></div></div>
      <h1 class="fNN-title">Bốn việc trước khi xuất bản</h1>
      <ul class="fNN-list">
        <li class="fNN-item" id="fNN-item-1"><div class="fNN-box" data-layout-ignore><div class="fNN-fill">✓</div></div><p class="fNN-text">Viết kịch bản</p><p class="fNN-desc">đã xong</p></li>
        <li class="fNN-item" id="fNN-item-2"><div class="fNN-box" data-layout-ignore><div class="fNN-fill">✓</div></div><p class="fNN-text">Thu giọng đọc</p><p class="fNN-desc">đã xong</p></li>
        <li class="fNN-item" id="fNN-item-3"><div class="fNN-box" data-layout-ignore><div class="fNN-fill">✓</div></div><p class="fNN-text">Dựng từng khung</p><p class="fNN-desc">đã xong</p></li>
        <li class="fNN-item" id="fNN-item-4"><div class="fNN-box" data-layout-ignore><div class="fNN-fill">✓</div></div><p class="fNN-text">Xem lại rồi xuất bản</p><p class="fNN-desc">đã xong</p></li>
      </ul>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      // seconds from the start of the frame: the title, when the list is laid out, and when each item is done
      var T = { title: 0.3, list: 1.0, ticks: [2.2, 3.6, 5.0, 6.4] };
      var END = 9;

      tl.fromTo(".fNN-topbar-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".fNN-title", { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.45, ease: "circ.out" }, T.title);
      T.ticks.forEach(function (t, i) {
        var item = "#fNN-item-" + (i + 1);
        tl.fromTo(item, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, T.list + i * 0.08);
        tl.fromTo(item + " .fNN-fill", { scale: 0 }, { scale: 1, duration: 0.32, ease: "back.out(2)" }, t);
        tl.fromTo(item + " .fNN-desc", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t + 0.1);
      });

      // hold still to the end of the frame
      tl.set({}, {}, END);
      window.__timelines["NN-slug"] = tl;
    })();
  </script>
</template>
