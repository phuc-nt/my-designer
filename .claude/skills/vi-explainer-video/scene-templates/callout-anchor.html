<!--
  callout-anchor: a subject that stays put while three notes are drawn out of it, one at a time.
  Scene template of the vi-explainer-video skill, written for this skill in the frame format
  of faceless-explainer: Vietnamese fonts, content kept above the caption zone, cue times
  taken from the narration, no exit animation.

  To use it for frame NN (see README.md in this folder):
    1. copy to compositions/frames/NN-slug.html; replace every "fNN-" with the frame prefix
       (f03-) and every "NN-slug" with the frame id;
    2. replace the tokens and the @font-face lines with those of the project's frame.md;
    3. replace the inside of .fNN-subject with the frame's picture (an image, an inline svg or
       a card) and move each row with its `top`; replace the title, three note titles (<= 20
       characters) and three one-line descriptions;
    4. set T to the word starts of this frame (title, subject, note 1, 2, 3) and END to its duration.
-->
<template>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-VN.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: block; }
    @font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/JetBrainsMono-VN.woff2") format("woff2"); font-weight: 100 800; font-style: normal; font-display: block; }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
    }
    /* tokens: ground, text, secondary text (>= 4.5:1 on the ground), accent, text on the accent, rules */
    .fNN-bg, .fNN-scene {
      --st-ground: #12100E;
      --st-ink: #F4EFE7;
      --st-muted: #B8ADA2;
      --st-accent: #FF5A36;
      --st-on-accent: #12100E;
      --st-line: rgba(244, 239, 231, 0.26);
      --st-display: "Inter", sans-serif;
      --st-mono: "JetBrains Mono", monospace;
    }
    .fNN-bg { position: absolute; inset: 0; background: var(--st-ground); }
    /* content box: ends at y = 862, above the caption zone (y > 896) */
    .fNN-scene {
      position: absolute;
      left: 108px;
      top: 72px;
      width: 1704px;
      height: 790px;
      box-sizing: border-box;
      font-family: var(--st-display);
      color: var(--st-ink);
    }
    .fNN-scene * { box-sizing: border-box; }
    .fNN-topbar { position: absolute; left: 0; top: 0; width: 1704px; height: 8px; background: var(--st-line); }
    .fNN-topbar-fill { width: 38%; height: 100%; background: var(--st-accent); transform-origin: left center; }
    .fNN-title { position: absolute; left: 0; top: 56px; width: 1704px; margin: 0; font-size: 76px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; opacity: 0; }
    /* the subject stays put; replace its inside with the frame's own picture (img, svg, card) */
    .fNN-subject { position: absolute; left: 0; top: 230px; width: 700px; height: 520px; border: 4px solid var(--st-line); display: grid; place-items: center; opacity: 0; }
    .fNN-subject-name { margin: 0; font-size: 64px; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; text-align: center; }
    /* one row per callout: a dot on the subject, a leader drawn from it, then the note */
    .fNN-call { position: absolute; left: 600px; width: 1104px; height: 150px; }
    .fNN-dot { position: absolute; left: 0; top: 16px; width: 28px; height: 28px; border-radius: 50%; background: var(--st-accent); transform: scale(0); }
    .fNN-lead { position: absolute; left: 28px; top: 28px; width: 232px; height: 4px; background: var(--st-accent); transform-origin: left center; transform: scaleX(0); }
    .fNN-note { position: absolute; left: 290px; top: 0; width: 814px; opacity: 0; }
    .fNN-note-title { margin: 0 0 8px; font-size: 46px; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em; }
    .fNN-desc { margin: 0; color: var(--st-muted); font-size: 32px; font-weight: 600; line-height: 1.38; }
  </style>

  <div id="root" data-composition-id="NN-slug" data-width="1920" data-height="1080" data-duration="8">
    <div id="fNN-bg" class="clip fNN-bg" data-start="0" data-duration="8" data-track-index="0"></div>
    <div class="fNN-scene">
      <div class="fNN-topbar" data-layout-ignore><div class="fNN-topbar-fill"></div></div>
      <h1 class="fNN-title">Ba chỗ cần nhìn trên một tấm thẻ</h1>
      <div class="fNN-subject" id="fNN-subject"><p class="fNN-subject-name">Thẻ công việc</p></div>
      <div class="fNN-call" id="fNN-call-1" style="top: 262px"><div class="fNN-dot" data-layout-ignore></div><div class="fNN-lead" data-layout-ignore></div><div class="fNN-note"><h2 class="fNN-note-title">Người nhận</h2><p class="fNN-desc">Mỗi việc chỉ có một người chịu trách nhiệm</p></div></div>
      <div class="fNN-call" id="fNN-call-2" style="top: 432px"><div class="fNN-dot" data-layout-ignore></div><div class="fNN-lead" data-layout-ignore></div><div class="fNN-note"><h2 class="fNN-note-title">Hạn chót</h2><p class="fNN-desc">Ngày cụ thể, không ghi "sớm nhất có thể"</p></div></div>
      <div class="fNN-call" id="fNN-call-3" style="top: 602px"><div class="fNN-dot" data-layout-ignore></div><div class="fNN-lead" data-layout-ignore></div><div class="fNN-note"><h2 class="fNN-note-title">Thế nào là xong</h2><p class="fNN-desc">Một câu để ai cũng kiểm được</p></div></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      // seconds from the start of the frame: the word starts of the title, the subject and each callout
      var T = { title: 0.3, subject: 1.0, calls: [2.2, 3.8, 5.4] };
      var END = 8;

      tl.fromTo(".fNN-topbar-fill", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo(".fNN-title", { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.45, ease: "circ.out" }, T.title);
      tl.fromTo("#fNN-subject", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, T.subject);
      T.calls.forEach(function (t, i) {
        var call = "#fNN-call-" + (i + 1);
        tl.fromTo(call + " .fNN-dot", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, t);
        tl.fromTo(call + " .fNN-lead", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, t + 0.1);
        tl.fromTo(call + " .fNN-note", { opacity: 0, x: 28 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, t + 0.35);
      });

      // hold still to the end of the frame
      tl.set({}, {}, END);
      window.__timelines["NN-slug"] = tl;
    })();
  </script>
</template>
