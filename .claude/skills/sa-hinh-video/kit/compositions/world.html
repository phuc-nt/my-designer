<template id="world-template">
  <div data-composition-id="world" data-width="1920" data-height="1080" data-start="0" data-duration="390.94">
    <style>
      @font-face { font-family: "Plus Jakarta Sans"; src: url("assets/fonts/PlusJakartaSans-VN.woff2") format("woff2"); font-weight: 200 800; font-style: normal; font-display: block; }
      [data-composition-id="world"] { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden; background: #dcebfa; }
      [data-composition-id="world"] canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      /* the text column: a dark panel that stays put while the frames above it change */
      #world-side {
        position: absolute; left: 0; top: 0; width: 712px; height: 1080px;
        background: linear-gradient(90deg, rgba(9, 11, 38, 0.97) 0px, rgba(11, 13, 44, 0.97) 632px, rgba(11, 13, 44, 0.6) 652px, rgba(11, 13, 44, 0.2) 676px, rgba(11, 13, 44, 0) 700px);
      }
      #world-side-edge { position: absolute; left: 632px; top: 0; width: 2px; height: 1080px; background: linear-gradient(180deg, rgba(196, 181, 253, 0) 0%, rgba(196, 181, 253, 0.34) 18%, rgba(96, 165, 250, 0.3) 82%, rgba(96, 165, 250, 0) 100%); }
    </style>
    <canvas id="world-canvas" width="1920" height="1080"></canvas>
    <div id="world-side" data-layout-allow-overflow><div id="world-side-edge"></div></div>
    <script type="module">
      import { createWorld } from "../assets/lib/world/world.js";
      const world = createWorld({ canvas: document.getElementById("world-canvas") });
      window.__world = world;
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["world"] = world.ready;
      const side = world.plan.side;
      const tl = gsap.timeline({ paused: true });
      // the video opens straight on the first situation, so the text column is already in place at 0
      if (side.in <= 0.05) tl.set("#world-side", { x: 0 }, 0);
      else tl.fromTo("#world-side", { x: -720 }, { x: 0, duration: 1.0, ease: "power3.out" }, side.in);
      tl.fromTo("#world-side", { x: 0 }, { x: -720, duration: 0.9, ease: "power2.in", immediateRender: false }, side.out);
      tl.set({}, {}, world.total);
      window.__timelines = window.__timelines || {};
      window.__timelines["world"] = tl;
      window.addEventListener("hf-seek", (e) => world.renderAt(e.detail.time));
      world.renderAt(window.__hfThreeTime || 0);
    </script>
  </div>
</template>
